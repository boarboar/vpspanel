; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	; --- TFT_eSPI setup (TJCTM24024-SPI / ILI9341 240x320) -------------------
	; These flags are applied to every translation unit, including the TFT_eSPI
	; library itself. Keep them in sync with src/config/display_config.h;
	; TftDashboard.cpp has static_asserts that fail the build on a mismatch.
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=5
	-D TFT_MOSI=6
	-D TFT_SCLK=4
	-D TFT_CS=7
	-D TFT_DC=3
	-D TFT_RST=10
	-D TFT_BL=-1
	-D TFT_BACKLIGHT_ON=1
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	; TFT_eSPI warns on every build that TOUCH_CS is undefined, which is
	; intentional here (the module's touch panel is unusable). It also emits an
	; informational warning about DMA not being available on the C3.
	-D DISABLE_ALL_LIBRARY_WARNINGS=1
	; TFT_eSPI 2.5.43 passes SPI2_HOST (1) to REG_SPI_BASE(), but IDF 5.x
	; expects the hardware instance (2). See include/tft_c3_regbase_fix.h.
	-include${PROJECT_DIR}/include/tft_c3_regbase_fix.h
upload_speed = 460800
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
	ewpa/LibSSH-ESP32@^5.10.0
	bblanchon/ArduinoJson@^7.0.0
	bodmer/TFT_eSPI@^2.5.43
